<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FinanPy</title>
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold">Dashboard</h1>
            <p class="text-gray-400">Bem-vindo ao seu painel financeiro</p>
        </header>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-2">Saldo Total</h2>
                <p class="text-2xl text-green-400">R$ 0,00</p>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-2">Receitas (Mês)</h2>
                <p class="text-2xl text-green-400">R$ 0,00</p>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-2">Despesas (Mês)</h2>
                <p class="text-2xl text-red-400">R$ 0,00</p>
            </div>
        </div>
        
        <div class="bg-gray-800 p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-semibold mb-4">Transações Recentes</h2>
            <p class="text-gray-400">Nenhuma transação registrada ainda.</p>
        </div>
        
        <div class="bg-gray-800 p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Gráfico de Despesas</h2>
            <p class="text-gray-400">Nenhum dado disponível para exibição.</p>
        </div>
    </div>
</body>
</html>
