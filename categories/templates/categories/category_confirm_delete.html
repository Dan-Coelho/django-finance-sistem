{% extends 'base_dashboard.html' %}

{% block title %}Excluir Categoria{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="bg-white shadow overflow-hidden sm:rounded-lg">
    <div class="px-4 py-5 sm:px-6 bg-red-50 border-b border-red-100">
      <h3 class="text-lg leading-6 font-medium text-red-800">
        Confirmar Exclusão
      </h3>
    </div>
    <div class="px-4 py-5 sm:p-6">
      <p class="text-gray-700 mb-4">
        Você tem certeza que deseja excluir a categoria <strong>{{ object.name }}</strong>?
      </p>
      
      <p class="text-gray-700 mb-6">
        Esta ação não poderá ser desfeita.
      </p>
      
      <form method="post" class="flex justify-end space-x-3">
        {% csrf_token %}
        <a href="{% url 'categories:list' %}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Cancelar
        </a>
        <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
          Confirmar Exclusão
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
