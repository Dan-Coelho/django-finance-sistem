<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Redefinida - FinanPy</title>
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full space-y-8 bg-gray-800 p-8 rounded-xl shadow-lg">
        <div class="text-center">
            <h2 class="mt-6 text-3xl font-extrabold">Senha Redefinida</h2>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 rounded-lg shadow-md {% if 'error' in message.tags %}bg-red-100 border border-red-300 text-red-700{% elif 'success' in message.tags %}bg-green-100 border border-green-300 text-green-700{% elif 'warning' in message.tags %}bg-yellow-100 border border-yellow-300 text-yellow-700{% else %}bg-blue-100 border border-blue-300 text-blue-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
                <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>

            <p class="mt-4 text-gray-400">
                Sua senha foi redefinida com sucesso! Agora você pode fazer login com sua nova senha.
            </p>

            <div class="mt-6">
                <a
                    href="{% url 'users:login' %}"
                    class="inline-block w-full py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                >
                    Fazer login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
