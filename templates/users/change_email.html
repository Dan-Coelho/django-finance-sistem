{% extends 'base_dashboard.html' %}

{% block dashboard_title %}Alterar Email{% endblock %}
{% block page_header %}Alterar Email{% endblock %}

{% block dashboard_content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-gray-800 rounded-xl p-6 shadow-lg">
        <h2 class="text-xl font-bold text-white mb-6">Alterar Email</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Novo Email</label>
                <input 
                    type="email" 
                    name="email" 
                    id="email" 
                    required 
                    class="w-full bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="seu-novo-email@exemplo.com"
                >
            </div>

            <div class="flex items-center justify-between pt-6">
                <a href="{% url 'profiles:detail' %}" class="px-6 py-2 border border-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors duration-200">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors duration-200">
                    Alterar Email
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
