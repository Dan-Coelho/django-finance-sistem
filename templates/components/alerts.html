{% if messages %}
<div class="container mx-auto px-4 mt-4">
    {% for message in messages %}
        <div class="rounded-md {% if 'error' in message.tags %}bg-red-500{% elif 'success' in message.tags %}bg-green-500{% else %}bg-blue-500{% endif %} p-4 mb-4">
            <div class="text-sm font-medium text-white">{{ message }}</div>
        </div>
    {% endfor %}
</div>
{% endif %}
