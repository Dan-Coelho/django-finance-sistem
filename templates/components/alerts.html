{% if messages %}
<div class="container mx-auto px-4 mt-4">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} p-4 mb-4 rounded bg-{{ message.tags }}-100 border border-{{ message.tags }}-300 text-{{ message.tags }}-700">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
