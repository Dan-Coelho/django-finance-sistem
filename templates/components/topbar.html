<div class="flex items-center justify-between px-6 py-4">
    <div class="flex items-center">
        <a href="/" class="text-xl font-bold text-blue-600 mr-4">FinanPy</a>
        <button id="sidebar-toggle" class="md:hidden mr-4 text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-xl font-semibold">{% block page_header %}{% endblock %}</h1>
    </div>
    
    <div class="flex items-center space-x-4">
        <div class="relative">
            <button id="notifications-button" class="p-1 rounded-full text-gray-400 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
            </button>
        </div>
        
        <div class="relative">
            <button id="user-menu-button" class="flex items-center max-w-xs text-sm rounded-full focus:outline-none">
                <span class="inline-block h-8 w-8 rounded-full overflow-hidden bg-gray-600">
                    <svg class="h-full w-full text-gray-300" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 12.004 5.993zM16.244 13.248c-3.204 0-5.248-2.044-5.248-5.248 0-3.204 2.044-5.248 5.248-5.248 3.204 0 5.248 2.044 5.248 5.248 0 3.204-2.044 5.248-5.248 5.248z"/>
                    </svg>
                </span>
                <span class="ml-2 text-sm font-medium text-white hidden md:block">{{ user.email }}</span>
            </button>
        </div>
        
        <div class="relative">
            <a href="{% url 'users:logout' %}" class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </a>
        </div>
    </div>
</div>
